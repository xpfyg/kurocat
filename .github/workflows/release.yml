name: Build Cross-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      linux_only:
        description: 'Only build Linux (x86_64 + ARM64) packages'
        type: boolean
        default: false
      macos_only:
        description: 'Only build macOS Universal (10.15+) packages'
        type: boolean
        default: false
      release_tag:
        description: 'Optional tag label for artifact naming (e.g. v4.8.0)'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.linux_only || inputs.macos_only)) }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app (Windows x64 - 65% Classic Installer)
        run: npm run tauri -- build --bundles nsis

      - name: Rename Windows installer asset
        shell: pwsh
        run: |
          $tag = '${{ inputs.release_tag }}'
          if ([string]::IsNullOrWhiteSpace($tag)) {
            if ($env:GITHUB_REF_NAME -match '^v') {
              $tag = $env:GITHUB_REF_NAME
            } else {
              $version = node -p "require('./package.json').version"
              $tag = "v$version"
            }
          }
          $ver = $tag.TrimStart('v')
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if ($null -eq $nsis) {
            throw 'Windows NSIS installer was not generated'
          }
          Copy-Item $nsis.FullName "MiniCat-$ver-x64-setup.exe"
          Copy-Item $nsis.FullName "MiniCat-x64-setup.exe"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minicat-windows-x64
          if-no-files-found: error
          path: |
            MiniCat-*-x64-setup.exe
            MiniCat-x64-setup.exe

      - name: Publish Windows assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          draft: false
          files: |
            MiniCat-*-x64-setup.exe
            MiniCat-x64-setup.exe

  build-macos:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.linux_only) }}
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable (Apple Silicon + Intel Universal)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Import Developer ID Application certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_CERTIFICATE:-}" ]]; then
            echo "::warning::APPLE_CERTIFICATE is not set, skipping certificate import"
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/developer-id-application.p12"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"

          echo "=== Code signing identities in temporary keychain ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          if [[ -n "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$APPLE_SIGNING_IDENTITY"; then
              echo "::error::APPLE_SIGNING_IDENTITY '$APPLE_SIGNING_IDENTITY' was not found in the imported certificate"
              exit 1
            fi
            echo "Developer ID Application identity '$APPLE_SIGNING_IDENTITY' is ready"
          fi

      - name: Build Tauri Universal macOS .app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [[ -z "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            echo "::warning::APPLE_SIGNING_IDENTITY is not set, the build will not be Developer ID signed"
            unset APPLE_SIGNING_IDENTITY
          fi
          npm run tauri -- build --target universal-apple-darwin --bundles app

      - name: Verify Developer ID Application signature
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/MiniCat.app"
          test -d "$APP_PATH"
          echo "=== Signature details ==="
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 || true
          if [[ -n "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
            codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -q "Authority=Developer ID Application"
            codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -q "TeamIdentifier="
            echo "Verified Developer ID Application signature"
          fi

      - name: Package Universal macOS .dmg and .app.tar.gz
        run: |
          TAG="${{ inputs.release_tag }}"
          if [[ -z "$TAG" ]]; then
            if [[ "${GITHUB_REF_NAME}" =~ ^v ]]; then
              TAG="${GITHUB_REF_NAME}"
            else
              TAG="v$(node -p "require('./package.json').version")"
            fi
          fi
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/MiniCat.app"
          test -d "$APP_PATH"
          echo "=== Verify macOS minimum version, code signature & Universal slices ==="
          codesign -dv --verbose=2 "$APP_PATH" 2>&1 || true
          plutil -p "$APP_PATH/Contents/Info.plist" | grep -i MinimumSystemVersion || true
          lipo -info "$APP_PATH/Contents/MacOS/MiniCat"
          lipo -info "$APP_PATH/Contents/MacOS/MiniCat" | grep -q 'x86_64'
          lipo -info "$APP_PATH/Contents/MacOS/MiniCat" | grep -q 'arm64'
          otool -arch x86_64 -l "$APP_PATH/Contents/MacOS/MiniCat" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" || true
          otool -arch arm64 -l "$APP_PATH/Contents/MacOS/MiniCat" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" || true
          mkdir -p dmg_staging
          cp -R "$APP_PATH" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "MiniCat" -srcfolder dmg_staging -ov -format UDZO "MiniCat-${TAG}-macos-universal.dmg"
          tar -czf "MiniCat-${TAG}-macos-universal.app.tar.gz" -C "src-tauri/target/universal-apple-darwin/release/bundle/macos" "MiniCat.app"
          test -s "MiniCat-${TAG}-macos-universal.dmg"
          test -s "MiniCat-${TAG}-macos-universal.app.tar.gz"
          ls -lh "MiniCat-${TAG}-macos-universal.dmg" "MiniCat-${TAG}-macos-universal.app.tar.gz"

      - name: Sign macOS .dmg
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          DMG_PATH="$(ls MiniCat-*-macos-universal.dmg | head -n 1)"
          test -f "$DMG_PATH"
          if [[ -z "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            echo "::warning::APPLE_SIGNING_IDENTITY is not set, skipping DMG signing"
            exit 0
          fi
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$DMG_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"
          spctl -a -t open --context context:primary-signature -vv "$DMG_PATH" || true

      - name: Create stable download aliases
        run: |
          DMG_PATH="$(ls MiniCat-*-macos-universal.dmg | head -n 1)"
          TARBALL_PATH="$(ls MiniCat-*-macos-universal.app.tar.gz | head -n 1)"
          test -f "$DMG_PATH"
          test -f "$TARBALL_PATH"
          cp "$DMG_PATH" MiniCat-macos-universal.dmg
          cp "$TARBALL_PATH" MiniCat-macos-universal.app.tar.gz
          ls -lh MiniCat-macos-universal.dmg MiniCat-macos-universal.app.tar.gz

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minicat-macos-universal
          if-no-files-found: error
          path: |
            MiniCat-*-macos-universal.dmg
            MiniCat-*-macos-universal.app.tar.gz
            MiniCat-macos-universal.dmg
            MiniCat-macos-universal.app.tar.gz

      - name: Publish macOS assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          draft: false
          files: |
            MiniCat-*-macos-universal.dmg
            MiniCat-*-macos-universal.app.tar.gz
            MiniCat-macos-universal.dmg
            MiniCat-macos-universal.app.tar.gz

  build-linux:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.macos_only) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Run Linux Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Linux .deb (KylinOS / Ubuntu / Debian / UOS)
        run: npm run tauri -- build --bundles deb

      - name: Build Tauri Linux .AppImage (best-effort)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: |
          npm run tauri -- build --bundles appimage || echo "AppImage bundle skipped on ${{ matrix.arch }}"

      - name: Smoke-test Linux binary and inspect ELF / .deb metadata
        run: |
          BIN="src-tauri/target/release/MiniCat"
          test -x "$BIN"
          echo "=== Dynamic libraries ==="
          ldd "$BIN"
          echo "=== Max GLIBC symbols required ==="
          objdump -T "$BIN" | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -n 10
          echo "=== MCP stdio live smoke test ==="
          RESP=$(printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}\n' | "$BIN" --mcp)
          echo "$RESP"
          echo "$RESP" | grep -q '"name":"kurocat"'
          echo "=== DEB metadata ==="
          DEB=$(ls src-tauri/target/release/bundle/deb/*.deb | head -n 1)
          dpkg-deb -I "$DEB"

      - name: Rename Linux packages
        shell: bash
        run: |
          TAG="${{ inputs.release_tag }}"
          if [[ -z "$TAG" ]]; then
            if [[ "${GITHUB_REF_NAME}" =~ ^v ]]; then
              TAG="${GITHUB_REF_NAME}"
            else
              TAG="v$(node -p "require('./package.json').version")"
            fi
          fi
          ARCH="${{ matrix.arch }}"
          DEB=$(ls src-tauri/target/release/bundle/deb/*.deb | head -n 1)
          cp "$DEB" "MiniCat-${TAG}-linux-${ARCH}.deb"
          cp "$DEB" "MiniCat-linux-${ARCH}.deb"
          APPIMG=$(ls src-tauri/target/release/bundle/appimage/*.AppImage 2>/dev/null | head -n 1 || true)
          if [[ -n "$APPIMG" && -f "$APPIMG" ]]; then
            cp "$APPIMG" "MiniCat-${TAG}-linux-${ARCH}.AppImage"
            cp "$APPIMG" "MiniCat-linux-${ARCH}.AppImage"
          fi
          ls -lh MiniCat-${TAG}-linux-${ARCH}.* MiniCat-linux-${ARCH}.*

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minicat-linux-${{ matrix.arch }}
          path: |
            MiniCat-*-linux-${{ matrix.arch }}.deb
            MiniCat-*-linux-${{ matrix.arch }}.AppImage
            MiniCat-linux-${{ matrix.arch }}.deb
            MiniCat-linux-${{ matrix.arch }}.AppImage

      - name: Publish Linux assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          draft: false
          files: |
            MiniCat-*-linux-${{ matrix.arch }}.deb
            MiniCat-*-linux-${{ matrix.arch }}.AppImage
            MiniCat-linux-${{ matrix.arch }}.deb
            MiniCat-linux-${{ matrix.arch }}.AppImage
